# Builds and tests Monomodule on macOS, Linux and Windows. On a version tag (v1.2.3) it also creates a draft
# GitHub release with the Linux and Windows downloads attached; the macOS installer is signed and notarized
# separately and added to the draft by hand before it is published.
name: build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,     platform: macos,   generator: Ninja, extra: '"-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"' }
          - { os: ubuntu-24.04, platform: linux,   generator: Ninja, extra: '' }
          - { os: windows-2022, platform: windows, generator: 'Visual Studio 17 2022', extra: '-A x64' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libasound2-dev libjack-jackd2-dev libfreetype-dev \
            libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libgl1-mesa-dev libcurl4-openssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Ninja (macOS)
        if: matrix.platform == 'macos'
        run: brew install ninja

      - name: Configure
        shell: bash
        run: cmake -S . -B build -G "${{ matrix.generator }}" ${{ matrix.extra }} -DCMAKE_BUILD_TYPE=Release -DMNM_COPY_PLUGINS=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage downloads
        shell: bash
        run: cmake -DBUILD_DIR=build -DOUT_DIR=dist -DPLATFORM=${{ matrix.platform }} -P cmake/stage_release.cmake

      - uses: actions/upload-artifact@v4
        with:
          name: monomodule-${{ matrix.platform }}
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/*-linux-*.zip
            dist/*-windows-*.zip
